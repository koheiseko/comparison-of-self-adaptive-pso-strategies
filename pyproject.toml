[project]
name = "pivic-comparison-of-self-adaptive-pso-strategies"
version = "0.1.0"
description = "Repositório dedicado à pesquisa de pivic sobre o PSO"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "tqdm>=4.67.1",
    "numpy (>=2.3.4,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "seaborn>=0.13.2,<0.14.0",
    "scipy (>=1.16.3,<2.0.0)",
    "opfunu-core>=1.0.6",
    "jinja2>=3.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ruff>=0.14.13",
]

[tool.ruff]
line-length = 80


[tool.ruff.lint]
select = [
    "E",  
    "W",  
    "F",  
    "I",  
    "B",  
    "C4",
    "UP",  
]

ignore = [
    "E501",  
    "B008",  
    "C901",  
    "W191",  
]

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "E501"]
